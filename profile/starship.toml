"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username@\
$hostname\
$localip\
$shlvl\
$singularity\
$kubernetes\
: $directory\
$vcsh\
$fossil_branch\
$fossil_metrics\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$pijul_channel\
$docker_context\
$package\
$c\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$gleam\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$typst\
$vlang\
$vagrant\
$zig\
$buf\
$nix_shell\
$conda\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$nats\
$direnv\
$env_var\
$mise\
$crystal\
$custom\
$sudo\
$cmd_duration\
$fill\
$time\
$line_break\
$jobs\
$battery\
$status\
$os\
$container\
$netns\
$shell\
$character"""

add_newline = true

[username]
show_always = true
style_user = "bold green"
format = "[$user](bold green)"

[hostname]
ssh_only = false
style = "bold yellow"
format = "[$hostname](bold yellow)"

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "

[time]
disabled = false
style = "white"
time_format = "%y-%m-%d %H:%M:%S"
format = " [$time](white)"

[fill]
symbol = " "

# Replace the '❯' symbol in the prompt with '➜'
[character] # The name of the module we are configuring is 'character'
success_symbol = '[❯](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'

[directory]
disabled = false
truncation_length = 0
truncate_to_repo = false

